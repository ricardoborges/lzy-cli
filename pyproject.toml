[build-system]
requires = ["setuptools>=80", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lzycli"
dynamic = ["version"]
description = "Translate natural language commands into Linux bash commands."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Ricardo Borges", email = "ricardoborges@gmail.com"}
]
keywords = ["ai", "bash", "cli", "linux", "nlp", "terminal"]
dependencies = [
    "pydantic>=2.11.4",
    "pydantic-ai>=0.1.11",
    "python-dotenv",
    "rich"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ricardoborges/lzy-cli"
Repository = "https://github.com/ricardoborges/lzy-cli"
Issues = "https://github.com/ricardoborges/lzy-cli/issues"

[project.scripts]
lzy = "lzy.cli:main"

[tool.setuptools_scm]
local_scheme = "no-local-version"
